<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    {% include tracking.html %}
    <a class="skip-link" href="#main">Skip to content</a>
    {% include navigation.html %}

    <main id="main">
      <div class="container">
        <header class="page-head">
          <p class="eyebrow">{% if page.kicker %}{{ page.kicker }}{% else %}{{ site.name }}{% endif %}</p>
          <h1>{{ page.title }}</h1>
          {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
        </header>
        <div class="page-body">
          {{ content }}
        </div>
      </div>
    </main>

    {% include footer.html %}
  </body>
</html>
