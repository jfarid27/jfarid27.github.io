<header class="site-header" id="site-header">
  <div class="container nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">LM</span>
      <span>{{ site.name }}</span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      {% for item in site.navigation %}
        <a class="nav-link {{ item.name }}{% if page.nav == item.name %} is-active{% endif %}"
           href="{{ item.url }}"
           {% if page.nav == item.name %}aria-current="page"{% endif %}
           {% if item.url contains 'http' %}rel="noopener"{% endif %}>{{ item.text }}</a>
      {% endfor %}
      <a class="btn btn-primary nav-cta" href="mailto:{{ site.email }}">Get in touch</a>
    </nav>
  </div>
</header>
